# Local PostgreSQL for development and tests.
# One server, two databases: qawm_dev (your data) and qawm_test (reset by tests).
services:
  db:
    image: postgres:16
    container_name: qawm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qawm_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - qawm-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qawm-pgdata:
